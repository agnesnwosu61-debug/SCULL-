name: Build Scull Video APK

"on":
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download Gradle 8.5
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip
          unzip -q gradle-8.5-bin.zip
          ./gradle-8.5/bin/gradle --version

      - name: Create Android App from index.html
        run: |
          mkdir -p app/src/main/java/com/scull/video
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          cat > settings.gradle <<'EOF'
          rootProject.name = "ScullVideo"
          include ':app'
          EOF
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.scull.video'
            compileSdk 34
            defaultConfig {
              applicationId "com.scull.video"
              minSdk 24
              targetSdk 34
              versionCode 1
              versionName "1.0"
            }
            compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
          }
          dependencies { implementation 'androidx.appcompat:appcompat:1.6.1' }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <application android:label="SCULL" android:theme="@style/Theme.AppCompat.Light.NoActionBar" android:usesCleartextTraffic="true">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN" />
                  <category android:name="android.intent.category.LAUNCHER" />
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
          cat > app/src/main/java/com/scull/video/MainActivity.kt <<'EOF'
          package com.scull.video
          import android.os.Bundle
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import android.webkit.WebChromeClient
          import androidx.appcompat.app.AppCompatActivity
          class MainActivity : AppCompatActivity() {
            override fun onCreate(savedInstanceState: Bundle?) {
              super.onCreate(savedInstanceState)
              val webView = WebView(this)
              webView.setBackgroundColor(android.graphics.Color.WHITE)
              webView.settings.javaScriptEnabled = true
              webView.settings.domStorageEnabled = true
              webView.settings.allowFileAccess = true
              webView.settings.allowContentAccess = true
              webView.settings.mediaPlaybackRequiresUserGesture = false
              webView.webViewClient = WebViewClient()
              webView.webChromeClient = WebChromeClient()
              webView.loadUrl("file:///android_asset/index.html")
              setContentView(webView)
            }
          }
          EOF
          cat > app/src/main/res/values/themes.xml <<'EOF'
          <resources>
            <style name="Theme.AppCompat.Light.NoActionBar" parent="android:Theme.Material.Light.NoActionBar" />
          </resources>
          EOF
          cp index.html app/src/main/assets/index.html
          ls -lh app/src/main/assets/

      - name: Build APK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          ./gradle-8.5/bin/gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SCULL-debug
          path: app/build/outputs/apk/debug/app-debug.apk
