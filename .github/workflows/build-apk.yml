name: Build Scull Video APK

"on":
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download Gradle 8.5
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip
          unzip -q gradle-8.5-bin.zip

      - name: Create Android App from index.html
        run: |
          mkdir -p app/src/main/java/com/scull/video
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/values
          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "ScullVideo"
          include ':app'
          EOF
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.2.2' }
          android {
            namespace 'com.scull.video'
            compileSdk 34
            defaultConfig {
              applicationId "com.scull.video"
              minSdk 24
              targetSdk 34
              versionCode 1
              versionName "1.0"
            }
            compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
          }
          dependencies { implementation 'androidx.appcompat:appcompat:1.6.1' }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <application android:label="SCULL" android:theme="@style/Theme.SCULL" android:usesCleartextTraffic="true">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN" />
                  <category android:name="android.intent.category.LAUNCHER" />
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
          cat > app/src/main/java/com/scull/video/MainActivity.java <<'EOF'
          package com.scull.video;
          import android.os.Bundle;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import androidx.appcompat.app.AppCompatActivity;
          public class MainActivity extends AppCompatActivity {
            @Override protected void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              WebView webView = new WebView(this);
              WebSettings s = webView.getSettings();
              s.setJavaScriptEnabled(true);
              s.setDomStorageEnabled(true);
              s.setDatabaseEnabled(true);
              s.setAllowFileAccess(true);
              s.setAllowContentAccess(true);
              s.setAllowFileAccessFromFileURLs(true);
              s.setAllowUniversalAccessFromFileURLs(true);
              s.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
              s.setMediaPlaybackRequiresUserGesture(false);
              s.setCacheMode(WebSettings.LOAD_DEFAULT);
              s.setUserAgentString("Mozilla/5.0 (Linux; Android 13; Pixel 7) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Mobile Safari/537.36");
              webView.setWebViewClient(new WebViewClient());
              webView.setWebChromeClient(new WebChromeClient());
              webView.loadUrl("file:///android_asset/index.html");
              setContentView(webView);
            }
          }
          EOF
          cat > app/src/main/res/values/themes.xml <<'EOF'
          <resources>
            <style name="Theme.SCULL" parent="Theme.AppCompat.Light.NoActionBar" />
          </resources>
          EOF
          cp index.html app/src/main/assets/index.html
          python3 -c "
          import pathlib
          p = pathlib.Path('app/src/main/assets/index.html')
          t = p.read_text()
          # Remove the stray second <script> block that breaks all JS
          bad = '''<script>
          if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js'); }
          window.addEventListener('online', ()=>{ location.reload(); });
          </script>'''
          t = t.replace(bad, '')
          # Safety: if splash still stuck after 4s, hide it and show error
          t = t.replace('</body>', '<script>setTimeout(()=>{var sp=document.getElementById(\"splash\"); if(sp) sp.classList.add(\"off\");},4000);</script></body>')
          p.write_text(t)
          print('patched index.html, removed stray script')
          "
          ls -lh app/src/main/assets/

      - name: Build APK
        run: ./gradle-8.5/bin/gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SCULL-debug
          path: app/build/outputs/apk/debug/app-debug.apk
