:root{--red:#D4A514;box-sizing:border-box;color-scheme:dark}

.pl{position:absolute;inset:0;overflow:hidden}

.pl iframe{width:max(100%,177.78vh);height:calc(100% + 160px);min-width:100%}
.pl .ok{opacity:1}
.tap{position:absolute;inset:0;z-index:2}

.top button.snd{position:absolute;right:12px;top:-2px;width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.4);display:grid;place-items:center}
.info{position:absolute;z-index:5;left:12px;right:78px;bottom:16px;text-shadow:0 1px 6px #000}
.info b{font-size:16px}.info p{margin:6px 0;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.mus{display:flex;gap:6px;font-size:13px;white-space:nowrap;overflow:hidden}.mus span{display:inline-block;animation:mq 9s linear infinite}
@keyframes mq{0%{transform:translateX(0)}100%{transform:translateX(-30%)}}
.rail{position:absolute;z-index:5;right:8px;bottom:16px;display:flex;flex-direction:column;align-items:center;gap:15px}
.rail button{display:flex;flex-direction:column;align-items:center;font-size:12px;font-weight:700;gap:2px;text-shadow:0 1px 4px #000}
.rail svg{width:34px;height:34px;fill:#fff;filter:drop-shadow(0 1px 4px rgba(0,0,0,.6))}
.rail .lk.on svg{fill:#D4A514}.rail .bm.on svg{fill:#F2C94C}
.av{width:46px;height:46px;border-radius:50%;border:2px solid #D4A514;object-fit:cover;background:#333;display:block}
